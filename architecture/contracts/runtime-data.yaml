schema_version: 1
contracts:
  - id: runtime.data
    title: Runtime state and local operator data
    tier: critical
    risk_tags:
      - persistence
      - security
    status: partial
    l0:
      owner: human
      status: frozen
      problem: Keep local runtime state operational but outside git, with explicit authority and cleanup boundaries.
    l1:
      owner: human
      status: frozen
      expression: state class -> owner/key/lifetime -> bridge config, secrets, sessions, process registry, service lifecycle, and external Runtime Services handoff
      paths:
        - architecture/system-design.md
        - architecture/agentic-ontology.md
    l2:
      owner: human
      status: frozen
      path: architecture/contracts/runtime-data.yaml
      freeze_signal: Bidirectional bridge correlation state accepted by human owner on 2026-07-22.
      invariants:
        - Runtime data under the local app home must never be committed.
        - Secret values are never printed, stored in git, or exposed through status surfaces.
        - Runtime-owned data must be classified as `bounded-state`, `durable-state`, or `external-provider-state`; model helper calls remain stateless from the bridge contract perspective.
        - Stateful bridge runtime data must declare owner, key, lifetime, cleanup rule, and whether execution endpoints can see the state.
        - Model provider config, shared model API keys, generated delivery artifacts, storage manifests, and vector indexes are Runtime Services data and live under the Runtime Services home.
        - Bridge config may store only caller-owned Runtime Services names (`runtimeServices.artifact_namespace`, `runtimeServices.vector_tableName`, `runtimeServices.record_namespace`, and `runtimeServices.record_tableName`); it must not store Runtime Services provider catalogs, model keys, artifact manifests, vector stores, or storage implementations.
        - Runtime Services data must stay outside git and outside the bridge runtime home by default.
        - Vector indexes are Runtime Services retrieval state and must not be treated as execution endpoint session memory.
        - Domain-agent execution sessions are endpoint-profile state, not bridge semantic memory.
        - Proactive interaction correlation is bridge-owned `bounded-state` keyed by correlation id and must reference carrier message id, conversation scope, endpoint profile, and originating domain-agent session id without copying the session itself.
        - ActionLog must durably record outbound intent, policy result, delivery result, correlation references, and reply-to-session resolution; carrier or provider logs alone are insufficient for correctness.
        - Runtime Services may support many domain agents, but access must be typed and raw state must not be reused across agents.
        - Provider-side logs or model memory are external-provider-state and must not be trusted for bridge correctness.
        - LaunchAgent is a macOS runtime adapter, not a generic architecture primitive.
        - A process registry entry proves only PID liveness; bounded per-process health snapshots are keyed by process id, owned and cleaned up by the bridge process, hidden from execution endpoints, and must expose fresh carrier and endpoint state for truthful operator readiness.
        - Canonical tests must use an isolated runtime home and must not write logs, reply-debug records, sessions, or health snapshots into the operator runtime home.
      generation_commands:
        - cwd: .
          command: pnpm test -- src/config/paths.test.ts src/config/schema-agent-endpoint.test.ts src/cli/commands/status.test.ts src/cli/commands/doctor.test.ts src/cli/commands/start.test.ts src/session/store.test.ts src/signal/correlation-store.test.ts src/signal/action-log.test.ts src/runtime/launch-agent.test.ts src/runtime/data-contract.test.ts src/runtime/health.test.ts src/bot/keepalive.test.ts src/test/runtime-home.test.ts src/runtime-services/selector.test.ts
          mode: check
          writes_workspace: false
          ci_required: true
      generation_command: pnpm test -- src/config/paths.test.ts src/config/schema-agent-endpoint.test.ts src/cli/commands/status.test.ts src/cli/commands/doctor.test.ts src/cli/commands/start.test.ts src/session/store.test.ts src/signal/correlation-store.test.ts src/signal/action-log.test.ts src/runtime/launch-agent.test.ts src/runtime/data-contract.test.ts src/runtime/health.test.ts src/bot/keepalive.test.ts src/test/runtime-home.test.ts src/runtime-services/selector.test.ts
      drift_checks:
        - agent-interaction-bridge architecture check
      drift_check: agent-interaction-bridge architecture check
    l3:
      owner: agent
      mode: durable
      carriers:
        - src/config
        - src/session
        - src/signal/correlation-store.ts
        - src/signal/action-log.ts
        - src/workspace/store.ts
        - src/runtime/registry.ts
        - src/runtime/launch-agent.ts
        - src/runtime/service-readiness.ts
        - src/runtime/data-contract.ts
        - src/runtime/health.ts
        - src/bot/keepalive.ts
        - src/cli/commands/start.ts
        - src/cli/commands/service.ts
        - src/cli/commands/status.ts
        - src/cli/commands/doctor.ts
      commands:
        - pnpm test -- src/config/paths.test.ts src/config/schema-agent-endpoint.test.ts src/cli/commands/status.test.ts src/cli/commands/doctor.test.ts src/cli/commands/start.test.ts src/session/store.test.ts src/runtime/launch-agent.test.ts src/runtime/data-contract.test.ts src/runtime/health.test.ts src/bot/keepalive.test.ts src/test/runtime-home.test.ts src/runtime-services/selector.test.ts
        - pnpm typecheck
    l4:
