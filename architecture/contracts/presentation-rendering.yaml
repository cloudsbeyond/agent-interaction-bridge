schema_version: 1
contracts:
  - id: presentation.rendering
    title: Expression planning and channel rendering
    tier: contracted
    risk_tags:
      - generated-artifact
      - schema
    status: partial
    l0:
      owner: human
      status: frozen
      problem: Shape domain-agent and bridge information for human surfaces without degrading into dense blobs, unsupported payloads, or carrier-specific ad hoc formatting.
    l1:
      owner: human
      status: frozen
      expression: InteractionIntent + ExpressionProfile + SurfaceContext + CapabilityCatalog + Policy -> PresentationPlan -> DeliveryPlan -> carrier payload
      paths:
        - architecture/system-design.md
        - architecture/agentic-ontology.md
    l2:
      owner: human
      status: frozen
      path: architecture/contracts/presentation-rendering.yaml
      freeze_signal: Emoji-labeled Bridge, Domain, and task elapsed footer accepted by human owner on 2026-07-23.
      invariants:
        - "`relay` mode must not invoke presentation planning, Dynamic UI reply-mode hints, expression transforms, image generation, or Feishu/Lark delivery support; it may still inject a plain-text response template and render the domain-agent stream in the configured message reply mode."
        - "`adapter` mode should inject a known channel presentation template when the channel is known; otherwise it may use Runtime Services model support for expression shaping when resources are available."
        - Known Feishu/Lark presentation templates should be grounded in current carrier facts such as `lark-cli` message shortcuts, Feishu post Markdown behavior, Card JSON 2.0, media payload rules, and card markdown line-break semantics.
        - Presentation planning starts from ontology objects, not carrier payloads or ad hoc text wrapping.
        - InteractionIntent contains conversational-act interpretation only. ExpressionProfile and PresentationPlan own representation, layout, density, sections, and presentation guidance.
        - Dynamic UI belongs to ExpressionProfile and PresentationPlan; InteractionIntent may record presentation feedback but must not own visual routing.
        - InteractionTurnPlan preserves ordered typed sections until one deterministic renderer lowers the Domain Agent prompt.
        - "Prompt section content contains only the tag body. The central renderer emits canonical XML-like tags, escapes structured attributes but not body text, normalizes CRLF or CR to LF, omits empty sections, and places exactly one blank line between sections with no outer blank lines."
        - "Prompt normalization removes only outer whitespace-only lines. User Markdown, indentation, internal blank lines, and fenced code remain unchanged; legacy sections already wrapped in their matching tag are unwrapped once before canonical rendering."
        - SurfaceContext controls density, medium, and carrier fit without changing task meaning.
        - Plain feedback should stay readable text unless PresentationPlan, approval, or choice semantics require richer structure.
        - Cards are one possible carrier lowering for state, approval, configuration, choices, reports, comparison, progress, and visual summaries.
        - Feishu/Lark card markdown lowering must preserve visible line boundaries with carrier-specific hard breaks outside fenced code blocks.
        - "Every normal Feishu/Lark text or card reply must end with one session identity footer using `📥` for Bridge scope, `🤖` for the Domain Agent thread, and `⏳` for elapsed task time. Bridge displays at most its final 8 characters, Domain displays at most its first 8 characters, shorter values stay unchanged, and no ellipses are added. When task timing is available, append `| ⏳ - <duration>` using compact minute/second notation; replies without task timing omit that segment. Markdown/card lowering uses a `>` quote block, and plain-text lowering omits quote syntax."
        - Session identity footers expose existing references for traceability only and must not select a scope, session, profile, endpoint, or approval state.
        - Explicit feedback asking for a card, structure, or visualization may influence ExpressionProfile and PresentationPlan; generic readability criticism must not force a card by itself.
        - Recognized visual scenarios must use explicit open layouts such as flow, dashboard, timeline, metric grid, or comparison blocks when the surface supports them.
        - Helper models may recommend expression or layout only through typed proposals with confidence, evidence, rejected alternatives, and policy notes.
        - Unsupported structured JSON must be rendered as safe fallback text, not posted raw.
        - Chat-facing prose requirements should be injected before domain-agent work when possible; card renderers must only apply carrier-generic hygiene such as raw text fences, heading glue, leaked interaction JSON checks, and dense paragraph splitting.
        - Feishu/Lark delivery may automatically execute stateless helper-model calls for expression/delivery artifact representations; durable artifacts must enter ArtifactStore before reuse.
        - Generated image artifacts should be sent as Feishu/Lark image messages after the primary rendered message; secondary media-send failures must not fail the primary signal delivery.
        - Expression/delivery helper support must not choose tools, approve risk, change endpoint profiles, mutate cwd/session state, or inject helper-model config into execution endpoint runs.
        - Presentation decisions that use model proposals, memory, or artifact generation should be recorded in ActionLog.
