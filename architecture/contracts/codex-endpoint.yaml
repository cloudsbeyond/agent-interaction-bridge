schema_version: 1
contracts:
  - id: codex.endpoint
    title: Codex endpoint adapters
    tier: contracted
    risk_tags:
      - api
      - authority-changing
      - security
    status: partial
    l0:
      owner: human
      status: frozen
      problem: Use local Codex exec and app-server as current execution endpoints without making either protocol the generic execution-agent boundary.
    l1:
      owner: human
      status: frozen
      expression: endpoint profile policy -> execution endpoint adapter -> AgentSignal -> bridge runtime
      paths:
        - architecture/system-design.md
        - architecture/agentic-ontology.md
    l2:
      owner: human
      status: frozen
      path: architecture/contracts/codex-endpoint.yaml
      freeze_signal: Agentic L0-L2 convergence accepted by human owner on 2026-05-29.
      invariants:
        - exec and app-server remain endpoint implementations behind the same agent boundary.
        - Profile constraints must project into cwd, CODEX_HOME, sandbox, approval policy, and session keys.
        - Execution endpoints are runtime execution agents, not human-facing bridge domain agents.
        - Endpoint model overrides must be explicit agent-endpoint controls, not sourced from bridge helper-model provider config by default.
        - Bridge helper-model provider keys must not be injected into Codex child process env unless an endpoint-specific policy explicitly requests that boundary crossing.
        - Bridge model resources must never be advertised or projected as Codex exec/app-server tools, capabilities, or authority.
        - Endpoint sessions and app-server pools are endpoint-profile state and must not become bridge memory unless policy maps them into typed ActionLog or AgentSignal objects.
        - Execution endpoint adapters must use endpoint-profile state only; they must not reuse bridge resources or sessions.
        - app-server compatibility changes must keep exec fallback available.
      generation_commands:
        - cwd: .
          command: pnpm test -- src/agent/codex/adapter.test.ts src/agent/codex/app-server-adapter.test.ts src/agent/codex/app-server-protocol.test.ts
          mode: check
          writes_workspace: false
          ci_required: true
      generation_command: pnpm test -- src/agent/codex/adapter.test.ts src/agent/codex/app-server-adapter.test.ts src/agent/codex/app-server-protocol.test.ts
      drift_checks:
        - agent-interaction-bridge architecture check
      drift_check: agent-interaction-bridge architecture check
    l3:
      owner: agent
      mode: durable
      carriers:
        - src/agent/types.ts
        - src/agent/factory.ts
        - src/agent/codex
        - src/agent/profile-policy.ts
      commands:
        - pnpm test -- src/agent/codex/adapter.test.ts src/agent/codex/app-server-adapter.test.ts src/agent/codex/app-server-protocol.test.ts
        - pnpm typecheck
    l4:
      owner: agent
      artifacts:
        - src/agent/types.ts
        - src/agent/factory.ts
        - src/agent/codex/adapter.ts
        - src/agent/codex/stream-json.ts
        - src/agent/codex/app-server-adapter.ts
        - src/agent/codex/app-server-protocol.ts
        - src/agent/profile-policy.ts
      ai_contract_index: agent-devops/ai-contract-index.md
      harness:
        - src/agent/codex/adapter.test.ts
        - src/agent/codex/app-server-adapter.test.ts
        - src/agent/codex/app-server-protocol.test.ts
        - src/agent/codex/stream-json.test.ts
      replay_evidence:
        - Contract-maintained endpoint code; replay is codex adapter and app-server protocol harness.
      hand_edit_guard: Update endpoint contract or profile policy harness before changing Codex authority boundaries.
    stop_condition: Return to L0-L2 when endpoint protocol behavior changes the generic agent boundary or authority model.
