schema_version: 1
contracts:
  - id: feishu.carrier
    title: Feishu/Lark bidirectional carrier interaction
    tier: contracted
    risk_tags:
      - schema
      - api
    status: partial
    l0:
      owner: human
      status: frozen
      problem: Keep Feishu/Lark as the current human channel for both human-initiated and domain-agent-initiated interaction while preserving channel-neutral runtime semantics, audit evidence, and reply continuity.
    l1:
      owner: human
      status: frozen
      expression: Feishu event -> HumanTurn -> bridge -> AgentTask -> domain agent; domain AgentSignal or outbound intent -> bridge correlation + DeliveryPlan -> Feishu payload -> reply HumanTurn -> originating session
      paths:
        - architecture/system-design.md
        - architecture/agentic-ontology.md
    l2:
      owner: human
      status: frozen
      path: architecture/contracts/feishu-carrier.yaml
      freeze_signal: Emoji-labeled Bridge, Domain, and task elapsed footer projection accepted by human owner on 2026-07-23.
      invariants:
        - Feishu payloads stay behind carrier adapters.
        - Raw receive_v1 message fields must be validated before they inform carrier decisions.
        - Scope isolates session, cwd, pending queue, and timeline for topic-style conversations.
        - Quotes, attachments, comments, reactions, and media cache are normalized into HumanTurn facts before runtime planning.
        - Feishu adapter derives SurfaceContext and carrier capabilities but must not decide InteractionIntent, ExpressionProfile, endpoint authority, cwd/session/profile, or approval semantics.
        - Feishu prompt planning may pass normalized context and typed helper-model proposals into the bridge runtime, but carrier code must not own those proposals.
        - Feishu projects only semantic surface facts needed by Domain Agent reasoning into InteractionTurnPlan; provider routing ids remain in Bridge state unless task semantics explicitly require them.
        - InteractionTurnPlan preserves ordered typed sections through policy and approval handling, and one deterministic renderer lowers the prompt at endpoint handoff.
        - "Bridge-to-Domain prompts use canonical tagged sections in this order: protocols, presentation hint, context and quotes, InteractionIntent and PresentationPlan, user message, then attachments. Relay omits adapter-only sections."
        - "The original user task is carried once inside `<user_message>`, quote metadata uses escaped section attributes, and carrier metadata plus attachments are each wrapped once by the central renderer."
        - Domain-agent-initiated messages must enter bridge policy, presentation, carrier delivery, and ActionLog; normal interaction must not bypass the bridge through a direct carrier client.
        - Endpoint-native AgentSignal and explicit interaction requests may enter proactive delivery; tool-result signals derived by Bridge are same-turn presentation enrichment and must not create resumable proactive correlation.
        - Bridge must persist a typed correlation from outbound intent through Feishu message id and conversation scope to the originating domain-agent session id before treating proactive delivery as resumable.
        - A reply to a bridge-delivered proactive message must resolve correlation and endpoint profile policy before session lookup, approval persistence, or domain-agent continuation.
        - Reply correlation, one-time reply consumption, and originating-session resume outcome are distinct states; `reply_consumed` must not be treated as proof of successful continuation, and ActionLog must record `resume_succeeded` or `resume_failed` for every attempted correlated resume.
        - Feishu send/update ids, retries, and delivery status remain bounded carrier state; only their typed correlation and audit records enter bridge state or ActionLog.
        - "Every normal Feishu/Lark text or card reply must append one session identity line as presentation-only traceability using `📥` for Bridge scope, `🤖` for the Domain Agent thread, and `⏳` for elapsed task time. Bridge displays at most its final 8 characters, Domain displays at most its first 8 characters, shorter values stay unchanged, and no ellipses are added. When task timing is available, append `| ⏳ - <duration>` using compact minute/second notation; replies without task timing omit that segment. Markdown/card carriers use a `>` quote block, and plain-text carriers omit quote syntax."
      generation_commands:
        - cwd: .
          command: pnpm test -- src/bot/feishu-raw-event-contract.test.ts src/bot/intake-contract.test.ts src/bot/prompt-plan.test.ts src/bot/scope.test.ts src/bot/agent-stream.test.ts src/bot/proactive-reply.test.ts src/bot/feishu-signal-delivery.test.ts src/bot/channel.test.ts src/bot/comments.test.ts src/commands/registry.test.ts src/card/session-identity.test.ts src/presentation/session-identity.test.ts src/signal/protocol.test.ts src/signal/ingress-policy.test.ts src/signal/action-log.test.ts src/signal/correlation-store.test.ts
          mode: check
          writes_workspace: false
          ci_required: true
      generation_command: pnpm test -- src/bot/feishu-raw-event-contract.test.ts src/bot/intake-contract.test.ts src/bot/prompt-plan.test.ts src/bot/scope.test.ts src/bot/agent-stream.test.ts src/bot/proactive-reply.test.ts src/bot/feishu-signal-delivery.test.ts src/bot/channel.test.ts src/bot/comments.test.ts src/commands/registry.test.ts src/card/session-identity.test.ts src/presentation/session-identity.test.ts src/signal/protocol.test.ts src/signal/ingress-policy.test.ts src/signal/action-log.test.ts src/signal/correlation-store.test.ts
      drift_checks:
        - agent-interaction-bridge architecture check
      drift_check: agent-interaction-bridge architecture check
