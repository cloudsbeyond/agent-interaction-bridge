      harness:
        - src/runtime-services/selector.test.ts
        - src/runtime-services/policy.test.ts
        - src/runtime-services/resources.test.ts
        - src/runtime-services/mcp-client.test.ts
        - src/runtime-services/parity.test.ts
        - src/runtime-services/discovery.test.ts
        - src/signal/delivery-support-runtime-services.test.ts
        - src/signal/delivery-support-executor.test.ts
        - src/cli/commands/resources.test.ts
        - src/cli/commands/models.test.ts
        - src/cli/commands/storage.test.ts
        - src/cli/commands/architecture.test.ts
        - src/architecture/contract-check.test.ts
        - src/architecture/contract-registry.test.ts
        - src/public-safety/check.test.ts
      replay_evidence:
        - Contract-maintained RuntimeServicesPort, JSON-RPC adapter, future MCP naming/transport scaffolding, secret/admin port guard, and architecture harness; Runtime Services implementation and capability registry have their own repository gates.
      hand_edit_guard: Update resource or architecture contract before changing Runtime Services availability or typed-result semantics.
    stop_condition: Return to L0-L2 before treating a Runtime Services capability as bridge-owned or as a domain-agent capability.
