schema_version: 1
contracts:
  - id: operator.commands
    title: Operator CLI and in-chat commands
    tier: critical
    risk_tags:
      - authority-changing
      - manual-review
    status: partial
    l0:
      owner: human
      status: frozen
      problem: Keep operator commands auditable and bounded while some surfaces remain explicit stubs.
    l1:
      owner: human
      status: frozen
      expression: CLI or slash command -> registry gate -> admin or user policy -> PresentationPlan, DeliveryPlan, or CLI output
      paths:
        - architecture/system-design.md
        - architecture/agentic-ontology.md
    l2:
      owner: human
      status: frozen
      path: architecture/contracts/operator-commands.yaml
      freeze_signal: Bounded resume preview accepted by human owner on 2026-07-23.
      invariants:
        - Commands that change credentials, publishing, exposure, or runtime authority require human ownership.
        - Stubs remain visible as draft capabilities rather than fake completed behavior.
        - In-chat admin commands must respect configured admin gates.
        - Model CLI output must show language, embedding, and vision module selections separately without revealing plaintext keys.
        - Model and storage CLI output should expose capability, resource, and state-class status without turning bridge helper resources into endpoint capabilities.
        - Model smoke calls must be explicit operator commands and must not run as part of normal execution endpoint work.
        - Secrets CLI stores only Feishu/Lark app secret entries in bridge `secrets.enc`; Runtime Services credentials are managed through `agent-runtime-services`.
        - Status and doctor CLI output must expose the resolved gateway mode and Runtime Services caller-owned names without exposing secrets.
        - Storage CLI must pass explicit Runtime Services `namespace` and `tableName` params from config or operator overrides instead of relying on bridge-owned storage defaults.
        - Storage CLI output may expose local artifact/vector paths and metadata, but must not print artifact bytes or grant execution endpoint authority.
        - Doctor CLI must stay read-only and separate local required resources from future compute stubs.
        - Status and doctor must distinguish a live process from a fresh connected carrier; missing, stale, reconnecting, degraded, stopped, or endpoint-unavailable health must not be reported as ready.
        - In-chat `/resume` must list sessions through the active endpoint profile, require explicit human selection, revalidate the selected thread, and reject active or cwd-mismatched threads before changing scope state.
        - In-chat `/resume` previews must remove known Bridge-owned prompt envelopes from endpoint name/preview metadata, collapse whitespace, and display at most 200 Unicode characters without loading conversation turns or invoking a helper model.
      generation_commands:
        - cwd: .
          command: pnpm test -- src/cli/commands/status.test.ts src/cli/commands/resources.test.ts src/cli/commands/models.test.ts src/cli/commands/storage.test.ts src/cli/commands/doctor.test.ts src/cli/commands/start.test.ts src/cli/commands/secrets.test.ts src/commands/resume.test.ts src/card/templates.test.ts
          mode: check
          writes_workspace: false
          ci_required: true
      generation_command: pnpm test -- src/cli/commands/status.test.ts src/cli/commands/resources.test.ts src/cli/commands/models.test.ts src/cli/commands/storage.test.ts src/cli/commands/doctor.test.ts src/cli/commands/start.test.ts src/cli/commands/secrets.test.ts src/commands/resume.test.ts src/card/templates.test.ts
      drift_checks:
        - agent-interaction-bridge architecture check
      drift_check: agent-interaction-bridge architecture check
    l3:
      owner: agent
      mode: durable
      carriers:
        - src/cli/index.ts
        - src/cli/commands
        - src/cli/commands/registry.ts
        - src/commands/index.ts
        - src/commands/registry.ts
        - src/card/templates.ts
        - src/card/account-cards.ts
        - src/card/config-card.ts
      commands:
        - pnpm test -- src/cli/commands/status.test.ts src/cli/commands/resources.test.ts src/cli/commands/models.test.ts src/cli/commands/storage.test.ts src/cli/commands/doctor.test.ts src/cli/commands/start.test.ts src/cli/commands/secrets.test.ts src/card/templates.test.ts
        - pnpm typecheck
    l4:
      owner: agent
      artifacts:
        - src/cli/index.ts
        - src/cli/commands/ps.ts
        - src/cli/commands/resources.ts
        - src/cli/commands/models.ts
        - src/cli/commands/storage.ts
        - src/cli/commands/doctor.ts
        - src/cli/commands/secrets.ts
        - src/cli/commands/service.ts
        - src/runtime/service-readiness.ts
        - src/cli/commands/start.ts
        - src/cli/commands/status.ts
        - src/cli/commands/registry.ts
        - src/commands/index.ts
        - src/commands/registry.ts
        - src/card/templates.ts
        - src/card/account-cards.ts
        - src/card/config-card.ts
      ai_contract_index: agent-devops/ai-contract-index.md
      harness:
        - src/cli/commands/status.test.ts
        - src/cli/commands/resources.test.ts
        - src/cli/commands/models.test.ts
        - src/cli/commands/storage.test.ts
        - src/cli/commands/doctor.test.ts
        - src/cli/commands/start.test.ts
        - src/cli/commands/service.test.ts
        - src/runtime/service-readiness.test.ts
        - src/cli/commands/secrets.test.ts
        - src/cli/commands/registry.test.ts
        - src/commands/registry.test.ts
        - src/commands/resume.test.ts
        - src/card/templates.test.ts
      replay_evidence:
        - Critical contract-maintained commands; replay is CLI, truthful runtime-health reporting, transactional restart, and in-chat command registry harness.
      hand_edit_guard: Update command authority and stub policy before changing command behavior.
    stop_condition: Return to L0-L2 before turning draft command stubs into durable operator workflows.
